name: Check account platform
on:
  push:
    branches: [main, codex/development]
  pull_request:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci && npm ci --prefix server
      - run: npm test && npm test --prefix server && npm run build:platform
      - run: node server/scripts/local-setup.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:platform:browser
